<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>汉语学习 · Chinese Learning</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --gold: #ffd700; --gold-dim: #c8a800;
            --bg: #0d0d1f; --bg2: #141428; --bg3: #1e1e3a; --bg4: #252545;
            --text: #f0e6d3; --text-dim: #a08060;
            --green: #2ecc71; --radius: 16px;
        }
        html, body {
            min-height: 100%; background: var(--bg); color: var(--text);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        /* ── Hero ── */
        .hero {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; padding: 64px 24px 48px; text-align: center;
            background: radial-gradient(ellipse at 50% 0%, rgba(255,215,0,.08) 0%, transparent 65%);
            border-bottom: 1px solid #1e1e40;
        }
        .hero-title {
            font-size: 64px; font-family: "Microsoft YaHei","STHeiti",serif;
            color: var(--gold); text-shadow: 0 0 30px rgba(255,215,0,.35);
            line-height: 1; margin-bottom: 12px;
        }
        .hero-sub {
            font-size: 18px; color: var(--text-dim); letter-spacing: 1px;
        }

        /* ── Section ── */
        section {
            max-width: 860px; margin: 0 auto; padding: 48px 24px;
        }
        .section-label {
            font-size: 11px; letter-spacing: 3px; text-transform: uppercase;
            color: var(--text-dim); margin-bottom: 20px;
        }
        .section-title {
            font-size: 26px; color: var(--gold);
            font-family: "Microsoft YaHei","STHeiti",serif;
            margin-bottom: 6px;
        }
        .section-desc {
            font-size: 14px; color: var(--text-dim); margin-bottom: 28px;
        }

        /* ── Lesson Grid ── */
        .lesson-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
        }
        .lesson-card {
            display: block; text-decoration: none;
            background: var(--bg3); border: 1px solid #3a3a60;
            border-radius: var(--radius); padding: 24px 22px;
            transition: all .2s; position: relative; overflow: hidden;
        }
        .lesson-card::before {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(135deg, rgba(255,215,0,.04) 0%, transparent 60%);
            pointer-events: none;
        }
        .lesson-card:hover {
            border-color: var(--gold-dim);
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(0,0,0,.4);
        }
        .lesson-card:active { transform: translateY(0); }
        .lesson-num {
            font-size: 12px; color: var(--text-dim); margin-bottom: 8px;
            letter-spacing: 1px;
        }
        .lesson-title-zh {
            font-size: 22px; font-family: "Microsoft YaHei","STHeiti",serif;
            color: var(--gold); margin-bottom: 4px; line-height: 1.3;
        }
        .lesson-title-en {
            font-size: 13px; color: var(--text-dim); margin-bottom: 16px;
        }
        .lesson-groups {
            display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px;
        }
        .group-tag {
            font-size: 12px; background: var(--bg4); border: 1px solid #3a3a60;
            color: #999; padding: 3px 10px; border-radius: 12px;
        }
        .lesson-meta {
            font-size: 12px; color: var(--text-dim);
            display: flex; align-items: center; gap: 6px;
        }
        .lesson-arrow {
            position: absolute; right: 20px; top: 50%;
            transform: translateY(-50%);
            font-size: 20px; color: #3a3a60;
            transition: color .2s, right .2s;
        }
        .lesson-card:hover .lesson-arrow { color: var(--gold); right: 16px; }

        /* ── Divider ── */
        hr { border: none; border-top: 1px solid #1e1e40; }
    </style>
</head>
<body>

<div class="hero">
    <div class="hero-title">汉语学习</div>
    <div class="hero-sub">Chinese Learning · Flashcards</div>
</div>

<section>
    <div class="section-label">Flashcard Lessons</div>
    <div class="section-title">选择一课 · Choose a Lesson</div>
    <div class="section-desc">Click any lesson to start reviewing vocabulary with flashcards.</div>

    <a class="lesson-card" id="globalHardCard" href="flashcards/viewer.html?global=1" style="display:none; border-color:#e74c3c; background: linear-gradient(135deg, #1f1428, #2a1535);">
        <div class="lesson-num" style="color:#e74c3c;">GLOBAL REVIEW</div>
        <div class="lesson-title-zh" style="color:#ff6b6b;">📚 Still Learning</div>
        <div class="lesson-title-en">Hard cards from all lessons — review them here</div>
        <div class="lesson-meta" id="globalHardMeta" style="color:#e74c3c;">📇 0 cards</div>
        <div class="lesson-arrow">→</div>
    </a>

    <div class="lesson-grid" id="lessonGrid">
        <!-- populated by script -->
    </div>
</section>

<script>
/* Lessons are defined in flashcards/lessons.json.
   To add a new lesson: add a folder + JSON files, then add one entry there. */
async function renderLessons() {
    const res     = await fetch('flashcards/lessons.json');
    const lessons = await res.json();
    const grid    = document.getElementById('lessonGrid');

    lessons.forEach(l => {
        const totalCards = l.decks.reduce((s, d) => s + (d.total || 0), 0);
        const deckLabel  = l.decks.length > 1 ? `${l.decks.length} decks · ${totalCards} cards` : `${totalCards} cards`;
        const groupTags  = l.decks.map(d => `<span class="group-tag">${d.emoji} ${d.titleZh}</span>`).join('');

        const a = document.createElement('a');
        a.className = 'lesson-card';
        a.href = `flashcards/lesson.html?lesson=${l.id}`;
        a.innerHTML = `
            <div class="lesson-num">${l.num}</div>
            <div class="lesson-title-zh">${l.titleZh}</div>
            <div class="lesson-title-en">${l.titleEn}</div>
            <div class="lesson-groups">${groupTags}</div>
            <div class="lesson-meta">📇 ${deckLabel}</div>
            <div class="lesson-arrow">→</div>
        `;
        grid.appendChild(a);
    });
}

renderLessons();

(function showGlobalHard() {
    try {
        const store = JSON.parse(localStorage.getItem('fc_global_hard') || '{}');
        const count = Object.keys(store).length;
        if (count > 0) {
            document.getElementById('globalHardCard').style.display = 'block';
            document.getElementById('globalHardMeta').textContent = '📇 ' + count + ' card' + (count !== 1 ? 's' : '');
        }
    } catch {}
})();
</script>
</body>
</html>
