<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>飞越中华 - Fly Through China 3D</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        body {
            background: #0a0a1a;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            display: block;
            outline: none;
            touch-action: none;
        }
        #loadingScreen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #0a0a1a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.8s;
        }
        #loadingScreen.hidden { opacity: 0; pointer-events: none; }
        #loadingScreen h1 {
            font-size: 48px;
            color: #ffd700;
            font-family: "Microsoft YaHei", "SimHei", "STHeiti", serif;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }
        #loadingScreen p {
            font-size: 20px;
            color: #ccaa66;
            margin-top: 10px;
        }
        #loadingScreen .spinner {
            margin-top: 30px;
            width: 40px; height: 40px;
            border: 3px solid #333;
            border-top-color: #ffd700;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loadingScreen">
        <h1>飞越中华</h1>
        <p>Fly Through China</p>
        <div class="spinner"></div>
    </div>
    <canvas id="renderCanvas"></canvas>

    <!-- Babylon.js -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>

    <!-- Game Systems (reused from 2.5D) -->
    <script src="src/systems/SpeechSystem.js"></script>
    <script src="src/systems/LearningSystem.js"></script>

    <!-- 3D Engine Modules -->
    <script src="src/engine/GameEngine.js"></script>
    <script src="src/engine/PlayerController.js"></script>
    <script src="src/engine/WorldBuilder.js"></script>
    <script src="src/engine/CollectibleManager.js"></script>
    <script src="src/engine/ParticleEffects.js"></script>
    <script src="src/engine/BackgroundMusic.js"></script>
    <script src="src/engine/UIManager.js"></script>

    <!-- Main Entry -->
    <script src="src/game.js"></script>
</body>
</html>
